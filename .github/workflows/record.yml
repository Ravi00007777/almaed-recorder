# Records one AlmaEd class: joins its Google Meet as the recorder account and streams it to
# YouTube. This repo is public (free unlimited minutes), so its logs are public: the Meet link,
# stream URL and login cookies only ever come from secrets and are never printed.
name: record

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: How long to stay in the call
        default: '5'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - name: Screen, sound and ffmpeg
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb pulseaudio ffmpeg > /dev/null
          pulseaudio -D --exit-idle-time=-1
          pactl load-module module-null-sink sink_name=rec > /dev/null
          pactl set-default-sink rec
      - name: Join and record
        env:
          MEET_URL: ${{ secrets.TEST_MEET_URL }}
          RTMP_URL: ${{ secrets.TEST_RTMP_URL }}
          MINUTES: ${{ inputs.minutes }}
          CHROME_CHANNEL: chrome
          DISPLAY: ':99'
        run: xvfb-run --server-num=99 --server-args='-screen 0 1280x720x24' node record.mjs
